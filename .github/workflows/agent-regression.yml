# Real-model regression gate. Needs a self-hosted runner with Ollama running
# (e.g. your own PC: Settings > Actions > Runners > New self-hosted runner),
# or switch MODEL to an API model and add the key as a repository secret.
name: agent-regression
on:
  workflow_dispatch:
  pull_request:
    paths: ["agent/**", "evals/tasks.yaml"]
env:
  MODEL: ollama:qwen2.5:14b
jobs:
  gate:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - run: python -m evals.run_suite --model "$MODEL" --trials 3 --name candidate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: python -m evals.gate --baseline results/baseline.json --candidate results/candidate.json
